[tool.poetry]
name = "youtube-content-strategist"
version = "0.1.0"
description = "Multi-agent YouTube content strategist using LangGraph and local LLMs"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{include = "youtube_strategist", from = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
langgraph = "^0.2.0"
langchain = "^0.3.0"
langchain-community = "^0.3.0"
ollama = "^0.3.0"
pydantic = "^2.0.0"
pillow = "^10.0.0"
requests = "^2.31.0"
beautifulsoup4 = "^4.12.0"
python-dotenv = "^1.0.0"
colorlog = "^6.8.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
black = "^24.0.0"
ruff = "^0.3.0"
mypy = "^1.8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false